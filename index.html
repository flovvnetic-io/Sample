<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GLB Model Viewer (No Transparency)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0f1c;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #eef2ff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .toolbar {
            padding: 1rem;
            text-align: center;
            background: #111827cc;
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #1e293b;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .upload-btn {
            background: #2563eb;
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.6rem 1.5rem;
            border-radius: 0.8rem;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
            border: 1px solid #3b82f6;
        }
        .upload-btn:hover { background: #1d4ed8; }
        #file-input { display: none; }
        .status {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-left: 0.5rem;
        }
        #viewer {
            flex: 1;
            background: #030712;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button class="upload-btn" onclick="document.getElementById('file-input').click()">📁 Open GLB</button>
        <input type="file" id="file-input" accept=".glb,.gltf">
        <span class="status" id="status-msg">No model loaded</span>
    </div>
    <div id="viewer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const viewer = document.getElementById('viewer');
        const fileInput = document.getElementById('file-input');
        const statusMsg = document.getElementById('status-msg');

        // --- Scene ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030712);
        scene.fog = new THREE.FogExp2(0x030712, 0.005);

        const camera = new THREE.PerspectiveCamera(45, viewer.clientWidth / viewer.clientHeight, 0.1, 50);
        camera.position.set(3, 2.5, 4.5);
        camera.lookAt(0, 0.2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(viewer.clientWidth, viewer.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        viewer.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 0.1, 0);
        controls.update();

        // --- Lights ---
        scene.add(new THREE.AmbientLight(0x3a4466, 0.7));
        const dirLight = new THREE.DirectionalLight(0xfff5e0, 1.2);
        dirLight.position.set(2.5, 3.5, 2);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(1024, 1024);
        dirLight.shadow.camera.near = 0.3;
        dirLight.shadow.camera.far = 15;
        dirLight.shadow.camera.left = -5;
        dirLight.shadow.camera.right = 5;
        dirLight.shadow.camera.top = 5;
        dirLight.shadow.camera.bottom = -5;
        scene.add(dirLight);

        const fillLight = new THREE.PointLight(0x4f7faa, 0.5);
        fillLight.position.set(-1.5, 1.5, 1.5);
        scene.add(fillLight);
        const rimLight = new THREE.PointLight(0xffaa66, 0.45);
        rimLight.position.set(0.5, 1.2, -2.2);
        scene.add(rimLight);

        // --- Floor & Grid ---
        const floorGeom = new THREE.PlaneGeometry(10, 10);
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x1a1e2e, roughness: 0.8, metalness: 0.2,
            transparent: true, opacity: 0.35
        });
        const floor = new THREE.Mesh(floorGeom, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -2.0;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(7, 20, 0x5f7fbf, 0x2a3a5a);
        gridHelper.position.y = -1.95;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.15;
        scene.add(gridHelper);

        // --- Model loading (force opaque) ---
        let currentModel = null;
        const loader = new GLTFLoader();

        function loadModel(file) {
            const url = URL.createObjectURL(file);
            statusMsg.textContent = 'Loading model...';

            loader.load(url,
                (gltf) => {
                    // Remove previous model
                    if (currentModel) {
                        scene.remove(currentModel);
                        disposeHierarchy(currentModel);
                    }

                    const model = gltf.scene;

                    // 🔧 Force all materials to be opaque – fixes transparency issue
                    model.traverse((child) => {
                        if (child.isMesh && child.material) {
                            const setOpaque = (mat) => {
                                mat.transparent = false;
                                mat.alphaTest = 0;     // no alpha discard
                                mat.depthWrite = true;
                                mat.needsUpdate = true;
                            };
                            if (Array.isArray(child.material)) {
                                child.material.forEach(setOpaque);
                            } else {
                                setOpaque(child.material);
                            }
                        }
                    });

                    scene.add(model);
                    currentModel = model;

                    // Auto-camera
                    const box = new THREE.Box3().setFromObject(model);
                    const size = box.getSize(new THREE.Vector3());
                    const center = box.getCenter(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / Math.sin(fov / 2));
                    camera.position.set(center.x + cameraZ * 0.6, center.y + cameraZ * 0.4, center.z + cameraZ);
                    controls.target.copy(center);
                    controls.update();

                    // Enable shadows
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    statusMsg.textContent = `✅ Model loaded – ${file.name} (materials set to opaque)`;
                    URL.revokeObjectURL(url);
                },
                undefined,
                (error) => {
                    console.error(error);
                    statusMsg.textContent = '❌ Failed to load model';
                    URL.revokeObjectURL(url);
                }
            );
        }

        function disposeHierarchy(obj) {
            obj.traverse((child) => {
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                    if (Array.isArray(child.material)) {
                        child.material.forEach(m => disposeMaterial(m));
                    } else {
                        disposeMaterial(child.material);
                    }
                }
            });
        }

        function disposeMaterial(mat) {
            if (mat.map) mat.map.dispose();
            if (mat.lightMap) mat.lightMap.dispose();
            if (mat.bumpMap) mat.bumpMap.dispose();
            if (mat.normalMap) mat.normalMap.dispose();
            if (mat.specularMap) mat.specularMap.dispose();
            if (mat.envMap) mat.envMap.dispose();
            mat.dispose();
        }

        // --- Events ---
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadModel(file);
        });

        viewer.addEventListener('dragover', (e) => { e.preventDefault(); });
        viewer.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && (file.name.endsWith('.glb') || file.name.endsWith('.gltf'))) {
                loadModel(file);
            } else {
                statusMsg.textContent = '⚠️ Please drop a .glb or .gltf file';
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = viewer.clientWidth / viewer.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewer.clientWidth, viewer.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
